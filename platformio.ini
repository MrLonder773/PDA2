[env:pda2]
platform = espressif32 @ 55.3.37
board = pda2
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_port = COM4

lib_deps =
    lovyan03/LovyanGFX @ 1.2.19
    lvgl/lvgl @ 9.2.1
    arduino-libraries/Madgwick @ 1.2.0
    https://github.com/esp32beans/ESP32_USB_Host_HID/archive/refs/heads/main.zip
    h2zero/NimBLE-Arduino @ 2.5.0
    
build_flags =
    -I include
    -I lib/PDA2Core/src
    -D LV_CONF_INCLUDE_SIMPLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
    -fno-rtti
; -D BOARD_HAS_PSRAM и -D PDA2_BOARD задаются в boards/pda2.json, здесь не повторять.
; -D ARDUINO_USB_MODE=1 и -D ARDUINO_USB_CDC_ON_BOOT=0 нужны для USB Host (OTG).
; build_unflags = -fno-rtti: RTTI включён для всего окружения (unflag глобален на env); LVGL и PDA2Core от него не зависят.
; Версии платформы и библиотек закреплены; ESP32_USB_Host_HID пока на main.zip (плавающая).
; nRF24 (RF24) в lib_deps нет: модуль опциональный, подробности в доке.