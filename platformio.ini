[env:pda2]
platform = espressif32
board = pda2
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_port = COM11

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ 9.2.1
    arduino-libraries/Madgwick
    nrf24/RF24
    https://github.com/esp32beans/ESP32_USB_Host_HID/archive/refs/heads/main.zip
    https://github.com/vindar/tgx
    h2zero/NimBLE-Arduino @ ^2.0.0   ; было ^1.4.0
build_flags =
    -I include
    -I lib/PDA2Core/src
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    
build_unflags =
    -fno-rtti
; ⚠️ -DBOARD_HAS_PSRAM и -DPDA2_BOARD — уже в boards/pda2.json
; -DARDUINO_USB_MODE=1 и -DARDUINO_USB_CDC_ON_BOOT=0 — нужны для USB Host (OTG)
; -std=c99 и TGL_FEATURE_* — нужны только TinyGL (.c файлы), на .cpp Arduino-фреймворка не влияют.
; -fno-rtti отключаем: GL-заголовки чистый C, но unflag глобален на env — RTTI теперь доступен и в остальном проекте (LVGL/PDA2Core от этого не зависят, безопасно).